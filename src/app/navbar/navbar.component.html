<nav class="relative flex justify-between items-center px-6 py-3 z-50 bg-white">
  <!-- Logo -->
  <a class="logo text-3xl font-bold leading-none" routerLink="/">
    <img src="assets/Logo.png" class="h-16 transition-all duration-300" alt="logo">
  </a>

  <!-- Main Navigation -->
  <ul class="hidden lg:flex lg:mx-auto lg:items-center lg:space-x-1">
    <li><a class="nav-link" routerLink="/acceuil">Accueil</a></li>


    <!-- Réclamation Dropdown -->
    <li class="relative group">
      <a class="nav-link flex items-center cursor-pointer">
        Réclamation
        <svg class="ml-1 w-4 h-4" fill="none" stroke="#1B15EA" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </a>
      <div
        class="dropdown-menu w-48 mt-2 py-2 bg-white rounded shadow-lg border border-gray-200 absolute hidden group-hover:block z-50">
        <a routerLink="/ajouter-reclamation"
          class="dropdown-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
          Ajouter Réclamation
        </a>
        <a routerLink="/consulter-reclamation"
          class="dropdown-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
          Consulter Réclamation
        </a>
        <a routerLink="/listes-reclamations"
          class="dropdown-item block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
          Liste Réclamations
        </a>
      </div>
    </li>

    <li><a class="nav-link" routerLink="/contact">Contact</a></li>
  </ul>

  <!-- Right Actions -->
  <div class="hidden lg:flex lg:items-center space-x-2">

    <div class="relative">
      <input type="text" placeholder="Rechercher..."
        class="border-b border-[#1B15EA] bg-transparent px-2 py-1 text-sm w-32 focus:w-64 transition-all duration-300 focus:outline-none">
      <i class="fas fa-search absolute right-2 top-2 text-[#1B15EA]"></i>
    </div>

    <button (click)="logoutKeycloak()" class="btn btn-danger">
      Sign Out
    </button>


    <!-- Espace Client Dropdown -->
    <div class="relative group">
      <button class="espace-client-link flex items-center">
        <i class="fas fa-user-circle mr-2 text-xl text-[#1B15EA]"></i>
        <span *ngIf="userName; else defaultText">{{ userName }}</span>
        <ng-template #defaultText>Espace Client</ng-template>
        <svg class="ml-1 w-4 h-4" fill="none" stroke="#1B15EA" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <div class="dropdown-menu right-0 w-56">
        <!-- Si connecté -->
        <ng-container *ngIf="isLoggedIn; else notLoggedIn">
          <a class="dropdown-item" routerLink="/edit-profile">
            <i class="fas fa-user mr-2 text-[#1B15EA]"></i> Profile
          </a>
          <button class="dropdown-item" (click)="logout()">
            <i class="fas fa-sign-out-alt mr-2 text-[#1B15EA]"></i> Logout
          </button>
        </ng-container>

        <!-- Si pas connecté -->
        <ng-template #notLoggedIn>
          <a class="dropdown-item" routerLink="/signIn">
            <i class="fas fa-sign-in-alt mr-2 text-[#1B15EA]"></i> Sign In
          </a>
          <a class="dropdown-item" routerLink="/signUp">
            <i class="fas fa-user-plus mr-2 text-[#1B15EA]"></i> Sign Up
          </a>
        </ng-template>

        <div class="border-t border-[#A6E1FD] my-1"></div>
      </div>
    </div>




  </div>

  <!-- Mobile menu button -->
  <button class="lg:hidden text-[#1B15EA] focus:outline-none">
    <i class="fas fa-bars text-2xl"></i>
  </button>
</nav>
