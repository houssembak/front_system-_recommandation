<div class="cart-dropdown absolute right-0 mt-2 w-96 bg-white rounded-lg shadow-xl z-50 border border-gray-200">
    <div class="p-4">
      <!-- Cart Header -->
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-lg font-bold text-[#1B15EA]">
          <i class="fas fa-shopping-cart mr-2"></i> Votre Panier
        </h3>
        <span class="text-sm text-gray-500">{{cartItems.length}} articles</span>
      </div>
      
      <!-- Cart Items Container -->
      <div class="max-h-96 overflow-y-auto">
        <!-- Items List -->
        <div *ngFor="let item of cartItems" class="cart-item border-b border-gray-100 py-3">
          <div class="flex items-center">
            <div *ngIf="item.type === 'product'; else trainingIcon">
              <img [src]="item.image" [alt]="item.name" class="w-16 h-16 object-cover rounded">
            </div>
            <ng-template #trainingIcon>
              <div class="w-16 h-16 bg-[#FFE600] rounded flex items-center justify-center">
                <i class="fas fa-certificate text-2xl text-white"></i>
              </div>
            </ng-template>
            
            <div class="ml-3 flex-1">
              <h4 class="font-medium">{{item.name}}</h4>
              <p class="text-sm text-gray-500">{{item.description}}</p>
              <div class="flex justify-between items-center mt-1">
                <span class="font-bold text-[#1B15EA]">{{item.price}} DT</span>
                <div class="flex items-center">
                  <button class="quantity-btn text-gray-500" (click)="decreaseQuantity(item)">
                    <i class="fas fa-minus"></i>
                  </button>
                  <span class="mx-2">{{item.quantity}}</span>
                  <button class="quantity-btn text-gray-500" (click)="increaseQuantity(item)">
                    <i class="fas fa-plus"></i>
                  </button>
                </div>
              </div>
            </div>
            <button class="remove-btn ml-2 text-gray-400 hover:text-red-500" (click)="removeItem(item)">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Cart Footer -->
      <div class="mt-4 pt-4 border-t border-gray-200">
        <div class="flex justify-between mb-2">
          <span>Total:</span>
          <span class="font-bold text-lg text-[#1B15EA]">{{getTotal()}} DT</span>
        </div>
        <button class="w-full bg-[#1B15EA] hover:bg-[#0F0D9E] text-white py-2 rounded-lg font-medium transition duration-300">
          <i class="fas fa-credit-card mr-2"></i> Passer la commande
        </button>
        <a href="#" class="block text-center text-sm text-[#1B15EA] mt-2 hover:underline">
          <i class="fas fa-shopping-bag mr-1"></i> Continuer mes achats
        </a>
      </div>
    </div>
  </div>
