<main class="gestion-utilisateur">
  <!-- Header -->
  <div class="content-header">
    <h1 class="page-title">Gestion des Utilisateurs</h1>
    <div class="header-actions">
      <div class="search-box">
          <svg viewBox="0 0 24 24" class="search-icon">
              <path fill="currentColor"
                  d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
          </svg>
          <input type="text" placeholder="Rechercher..." [(ngModel)]="searchTerm">
      </div>

      <button class="action-button" (click)="toggleAddForm()">
        {{ showAddForm ? 'Annuler' : (isUpdate ? 'Mettre à jour' : 'Ajouter Utilisateur') }}
      </button>
    </div>
  </div>
  

  <!-- Add or Update User Form (inline) -->
  <div *ngIf="showAddForm" class="form-container">
    <form (ngSubmit)="isUpdate ? updateUtilisateur() : addUtilisateur()">
      <div class="form-field">
        <label for="nom" class="input-label">Nom</label>
        <input
          type="text"
          id="nom"
          [(ngModel)]="newUtilisateur.nom"
          name="nom"
          required
          placeholder="Nom"
        />
      </div>

      <div class="form-field">
        <label for="email" class="input-label">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="newUtilisateur.email"
          name="email"
          required
          placeholder="Email"
        />
      </div>

      <div class="form-field">
        <label for="role" class="input-label">Rôle</label>
        <select id="role" [(ngModel)]="newUtilisateur.role" name="role" required>
          <option value="Consultant Sécurité">Consultant Sécurité</option>
          <option value="Technicien IT">Technicien IT</option>
        </select>
      </div>

      <button type="submit" class="submit-button">
        {{ isUpdate ? 'Mettre à jour' : 'Ajouter' }}
      </button>
    </form>
  </div>


  <!-- Table of Users -->
  <div class="table-container">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nom</th>
          <th>Email</th>
          <th>Rôle</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let utilisateur of utilisateurs">
          <td>{{ utilisateur.nom }}</td>
          <td>{{ utilisateur.email }}</td>
          <td>{{ utilisateur.role }}</td>
          <td class="action-cell">
            <button class="edit-button" (click)="editUtilisateur(utilisateur)">Modifier</button>
            <button class="delete-button" (click)="deleteUtilisateur(utilisateur.id)">Supprimer</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
