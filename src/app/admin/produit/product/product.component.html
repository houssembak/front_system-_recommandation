<main class="admin-content">
    <div class="content-header">
        <h1 class="page-title">Gestion des Produits</h1>
        <div class="header-actions">
            <button class="add-button" (click)="toggleAddForm()">
                <svg viewBox="0 0 24 24" class="button-icon">
                    <path fill="currentColor" d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                </svg>
                {{ showAddForm ? 'Annuler' : 'Ajouter Produit' }}
            </button>
            <div class="search-box">
                <svg viewBox="0 0 24 24" class="search-icon">
                    <path fill="currentColor"
                        d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                </svg>
                <input type="text" placeholder="Rechercher..." [(ngModel)]="searchTerm">
            </div>
        </div>
    </div>

    <!-- Add Product Form -->
    <div *ngIf="showAddForm" class="add-form-container">
        <app-ajouter-produit (productAdded)="onProductAdded()"></app-ajouter-produit>
    </div>

    <!-- Products Table -->
    <div class="table-responsive">
        <table class="products-table">
            <thead>
                <tr>
                    <th class="text-left">Nom</th>
                    <th class="text-left">Description</th>
                    <th class="text-right">Prix</th>
                    <th class="text-right">Quantité</th>
                    <th class="text-center">Image</th>
                    <th class="text-center">Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let produit of filteredProduits">
                    <td>{{ produit.nom }}</td>
                    <td>{{ produit.description }}</td>
                    <td class="text-right">{{ produit.prix | currency:'EUR':'symbol':'1.2-2' }}</td>
                    <td class="text-right">{{ produit.quantite }}</td>
                    <td class="text-center">
                        <img *ngIf="produit.imageUrl" [src]="'http://localhost:8081/uploads/' + produit.imageUrl"
                            alt="Produit" width="80">
                    </td>
                    <td class="text-center">
                        <div class="actions-container">
                            <button class="icon-button">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <path fill="currentColor"
                                        d="M5 20h14v-2H5v2zm14.7-13.3l-2.4-2.4c-.4-.4-1-.4-1.4 0L9 11.6V15h3.4l7.3-7.3c.4-.4.4-1 0-1.4z" />
                                </svg>
                            </button>

                            <button (click)="supprimerProduit(produit.id)" class="icon-button">
                                <svg width="24" height="24" viewBox="0 0 24 24">
                                    <path fill="currentColor"
                                        d="M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19M19,4H15.5L14.79,3.29C14.42,2.9 13.84,2.9 13.46,3.29L12.75,4H9V6H19V4Z" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
