<form (ngSubmit)="onSubmit()">
    <!-- Champ Nom -->
    <div class="form-field">
        <label for="nom" class="input-label">Nom du produit</label>
        <input type="text" id="nom" [(ngModel)]="product.nom" name="nom" required />
    </div>

    <!-- Champ Prix -->
    <div class="form-field">
        <label for="prix" class="input-label">Prix</label>
        <input type="number" id="prix" [(ngModel)]="product.prix" name="prix" required />
    </div>

    <!-- Champ Description -->
    <div class="form-field">
        <label for="description" class="input-label">Description</label>
        <textarea id="description" [(ngModel)]="product.description" name="description" required></textarea>
    </div>

    <!-- Champ Catégorie -->
    <div class="form-field">
        <label for="categorie" class="input-label">Catégorie</label>
        <select id="categorie" [(ngModel)]="product.categorie" name="categorie" required>
            <option *ngFor="let category of categories" [value]="category">{{ category }}</option>
        </select>
    </div>

    <!-- Champ Quantité -->
    <div class="form-field">
        <label for="quantite" class="input-label">Quantité</label>
        <input type="number" id="quantite" [(ngModel)]="product.quantite" name="quantite" required />
    </div>

    <!-- Champ Image -->
    <div class="form-field">
        <label for="image" class="input-label">Image</label>
        <input type="file" id="image" (change)="onImageUpload($event)" />
    </div>

    <!-- Champ de Disponibilité -->
    <div class="form-field">
        <label class="checkbox-label">
            <input type="checkbox" id="disponible" [(ngModel)]="product.disponible" />
            Disponible
        </label>
    </div>

    <!-- Affichage de la disponibilité -->
    <p>Le produit est : <strong>{{ product.disponible ? 'Disponible' : 'Non disponible' }}</strong></p>

    <!-- Bouton de soumission -->
    <button type="submit" [disabled]="!product.nom || !product.prix || !product.description || !product.categorie || !product.quantite">
        Ajouter le produit
    </button>
</form>
