<main class="gestion-formations">
    <div class="content-header">
        <h1 class="page-title">Gestion des Formations</h1>
        <div class="header-actions">
            <button (click)="toggleAddForm()">
                {{ showAddForm ? 'Annuler' : 'Ajouter Formation' }}
            </button>
            <div class="search-box">
                <svg viewBox="0 0 24 24" class="search-icon">
                    <path fill="currentColor"
                        d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" />
                </svg>
                <input type="text" placeholder="Rechercher..." [(ngModel)]="searchTerm">
            </div>
        </div>
    </div>

    <!-- Add or Update Formation Form -->
    <div *ngIf="showAddForm">
        <form (ngSubmit)="onSubmit()">
            <!-- Title Input -->
            <div class="form-field">
                <label for="titre" class="input-label">Titre</label>
                <input type="text" id="titre" [(ngModel)]="formation.titre" name="titre" placeholder="Titre" required>
            </div>

            <!-- Description Input -->
            <div class="form-field">
                <label for="description" class="input-label">Description</label>
                <input type="text" id="description" [(ngModel)]="formation.description" name="description" placeholder="Description" required>
            </div>

            <!-- Price Input -->
            <div class="form-field">
                <label for="prix" class="input-label">Prix</label>
                <input type="number" id="prix" [(ngModel)]="formation.prix" name="prix" placeholder="Prix" required>
            </div>

            <!-- Date Start Input -->
            <div class="form-field">
                <label for="dateDebut" class="input-label">Date Début</label>
                <input type="date" id="dateDebut" [(ngModel)]="formation.dateDebut" name="dateDebut" placeholder="Date Début" required>
            </div>

            <!-- Date End Input -->
            <div class="form-field">
                <label for="dateFin" class="input-label">Date Fin</label>
                <input type="date" id="dateFin" [(ngModel)]="formation.dateFin" name="dateFin" placeholder="Date Fin" required>
            </div>

            <!-- Available Checkbox -->
            <div class="form-field">
                <label class="checkbox-label">
                    <input type="checkbox" [(ngModel)]="formation.disponible" name="disponible">
                    Disponible
                </label>
            </div>

            <!-- Submit Button -->
            <button type="submit">{{ isUpdate ? 'Mettre à jour' : 'Ajouter' }}</button>
        </form>
    </div>

    <!-- Formations Table -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Titre</th>
                    <th>Description</th>
                    <th>Prix</th>
                    <th>Date Début</th>
                    <th>Date Fin</th>
                    <th>Disponible</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let formation of filteredFormations">
                    <td>{{ formation.titre }}</td>
                    <td>{{ formation.description }}</td>
                    <td>{{ formation.prix | currency:'D' }}</td>
                    <td>{{ formation.dateDebut }}</td>
                    <td>{{ formation.dateFin }}</td>
                    <td>{{ formation.disponible ? 'Oui' : 'Non' }}</td>
                    <td>
                        <button (click)="editFormation(formation)">Modifier</button>
                        <button (click)="supprimerFormation(formation.id)">Supprimer</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>
